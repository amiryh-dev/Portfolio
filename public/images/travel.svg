<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"><title>Travel booking system overview</title><desc>Vue frontend, cached external APIs, Laravel Queue, and automated tickets streamline travel bookings.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#203353"/><stop offset="1" stop-color="#18243e"/></linearGradient><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#8cadd5"/></marker></defs><rect width="720" height="430" fill="url(#b)"/><g font-family="Arial, sans-serif"><text x="43" y="52" fill="#a3b4d2" font-size="13" letter-spacing="2">TRAVEL &amp; COMMERCE</text><text x="40" y="116" fill="#e0e9f9" font-size="43" font-weight="600" letter-spacing="-1">A smoother journey.</text><text x="43" y="150" fill="#a6b9d5" font-size="16">Flights · Hotels · Buses · Insurance</text><rect x="43" y="206" width="156" height="96" rx="8" fill="#2a4164" stroke="#4f688b"/><text x="63" y="242" fill="#dce8ff" font-size="18" font-weight="600">Vue.js app</text><text x="63" y="275" fill="#a4bfdf" font-size="13">Search &amp; booking</text><path d="M210 254H252" stroke="#8cadd5" marker-end="url(#a)"/><rect x="268" y="206" width="175" height="96" rx="8" fill="#223651" stroke="#4f688b"/><text x="288" y="242" fill="#dce8ff" font-size="18" font-weight="600">Cached APIs</text><text x="288" y="275" fill="#a4bfdf" font-size="13">Laravel + Queue</text><path d="M454 254H496" stroke="#8cadd5" marker-end="url(#a)"/><rect x="512" y="206" width="163" height="96" rx="8" fill="#2b4160" stroke="#7792b6"/><text x="532" y="242" fill="#e4ecfa" font-size="18" font-weight="600">Auto ticketing</text><text x="532" y="275" fill="#a4bfdf" font-size="13">Less manual work</text><text x="43" y="354" fill="#b6cdf0" font-size="24" font-weight="600">≈ 70%<tspan fill="#a6b8d1" font-size="14" font-weight="400"> less support workload</tspan></text></g></svg>
