<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"><title>Editools system overview</title><desc>A creative asset library is delivered through prioritization, lazy loading and caching into a design editor with embedded SVG editing.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#173c40"/><stop offset="1" stop-color="#122b35"/></linearGradient><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#70b5a9"/></marker></defs><rect width="720" height="430" fill="url(#b)"/><g fill="none" stroke="#3d5e63" opacity=".25"><path d="M0 80H720M0 160H720M0 240H720M0 320H720M80 0V430M160 0V430M240 0V430M320 0V430M400 0V430M480 0V430M560 0V430M640 0V430"/></g><g font-family="Arial, sans-serif"><text x="43" y="52" fill="#91b9bb" font-size="13" letter-spacing="2">CREATIVE SOFTWARE</text><text x="40" y="122" fill="#def1ed" font-size="57" font-weight="600" letter-spacing="-2">editools<tspan fill="#76e2c6">.</tspan></text><text x="544" y="93" fill="#8ce8cd" font-size="46" font-weight="600">≈ 3×</text><text x="548" y="119" fill="#9dbfbf" font-size="14">faster initial load</text><rect x="42" y="191" width="183" height="115" rx="9" fill="#1d454a" stroke="#426a6b"/><text x="62" y="226" fill="#a8c9c7" font-size="13">CLOUD ASSET LIBRARY</text><text x="62" y="265" fill="#e2f0ed" font-size="28" font-weight="600">2M+ assets</text><text x="62" y="287" fill="#9dbabf" font-size="12">Images · vectors · fonts</text><path d="M235 248H273" stroke="#70b5a9" marker-end="url(#a)"/><rect x="288" y="212" width="147" height="72" rx="8" fill="#14333d" stroke="#426b6c"/><text x="307" y="242" fill="#d3e9e3" font-size="15">Prioritize + cache</text><text x="307" y="266" fill="#9abebd" font-size="13">Load on demand</text><path d="M444 248H482" stroke="#70b5a9" marker-end="url(#a)"/><rect x="497" y="183" width="178" height="130" rx="9" fill="#203f47" stroke="#649589"/><text x="517" y="221" fill="#e0f4ed" font-size="19" font-weight="600">Design editor</text><path d="M517 239H653" stroke="#416069"/><text x="517" y="267" fill="#8cd9c4" font-size="15">Embedded SVG</text><text x="517" y="291" fill="#a8c5c4" font-size="13">React + Next.js</text><text x="43" y="357" fill="#94b8bb" font-size="13">PRIORITIZE WHAT MATTERS. LOAD THE REST LATER.</text></g></svg>
